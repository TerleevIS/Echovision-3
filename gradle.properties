# Настройки сборки Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

minecraft_version=26.2
loader_version=0.19.3

# Loom для 26.2+ (Minecraft без обфускации). Если сборка ругается, что
# такой версии плагина нет - зайди на https://fabricmc.net/develop/ и
# подставь актуальный номер (там же смотри loader_version/fabric_version).
loom_version=1.17-SNAPSHOT

# Свойства мода
mod_version=1.0.0
maven_group=com.echomod
archives_base_name=echovision

# Проверено на 06.08.2026 (Modrinth: modrinth.com/mod/fabric-api).
fabric_version=0.153.0+26.2
