name: Build EchoVision

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # ВРЕМЕННЫЙ диагностический шаг. Он никак не чинит сборку сам по
      # себе — он читает точные сигнатуры методов нужных классов Minecraft
      # (Camera, GameRenderer, Minecraft/BlockRenderDispatcher,
      # GuiGraphicsExtractor#blitSprite, RenderPipelines, ClipContext)
      # прямо из скомпилированных .class-файлов джарника через javap
      # (штатная утилита JDK, без декомпиляции — раньше пробовали через
      # Loom genSources, но в этой версии Loom декомпилированные исходники
      # не кладутся ни в один доступный файл). У разработчика нет доступа
      # в интернет, чтобы посмотреть эти сигнатуры напрямую, поэтому их
      # нужно увидеть один раз здесь, в логе. Удалите этот шаг после того,
      # как сборка снова заработает.
      - name: DEBUG - dump relevant Minecraft API signatures
        run: |
          echo "DEBUG-SCRIPT-VERSION: v4-javap"

          MC_JAR=$(find "$HOME/.gradle/caches/fabric-loom/minecraftMaven" -iname "minecraft-merged-deobf-*.jar" ! -iname "*.backup" 2>/dev/null | head -n1)
          echo "Using jar: $MC_JAR"
          if [ -z "$MC_JAR" ]; then
            echo "!!! Джарник ещё не скачан/не смаплен на этом этапе — соберём проект хотя бы частично, чтобы Loom его подготовил"
            gradle compileJava --stacktrace || true
            MC_JAR=$(find "$HOME/.gradle/caches/fabric-loom/minecraftMaven" -iname "minecraft-merged-deobf-*.jar" ! -iname "*.backup" 2>/dev/null | head -n1)
            echo "Using jar (2nd try): $MC_JAR"
          fi

          find_class() {
            unzip -l "$MC_JAR" | grep -iE "$1" | awk '{print $4}'
          }

          dump_javap() {
            local label="$1" pattern="$2" grepfor="$3"
            echo "===== $label ====="
            local entry
            entry=$(find_class "$pattern" | head -n1)
            echo "entry: $entry"
            if [ -n "$entry" ]; then
              local fqn
              fqn=$(echo "$entry" | sed 's/\.class$//' | tr '/' '.')
              if [ -n "$grepfor" ]; then
                javap -p -classpath "$MC_JAR" "$fqn" 2>&1 | grep -i -E "$grepfor" || echo "(нет строк по маске '$grepfor' — см. полный вывод ниже)"
                javap -p -classpath "$MC_JAR" "$fqn" 2>&1 || true
              else
                javap -p -classpath "$MC_JAR" "$fqn" 2>&1 || true
              fi
            else
              echo "!!! класс не найден по паттерну $pattern"
            fi
          }

          dump_javap "Camera" "/Camera\.class$" ""
          dump_javap "GameRenderer (методы про camera)" "/GameRenderer\.class$" "camera"
          dump_javap "Minecraft (методы про blockRenderer/render)" "/Minecraft\.class$" "render"
          dump_javap "BlockRenderDispatcher" "/BlockRenderDispatcher\.class$" ""
          dump_javap "BlockModelShaper" "/BlockModelShaper\.class$" ""

          echo "===== Поиск всех классов, содержащих в имени GuiGraphics ====="
          find_class "GuiGraphics"
          dump_javap "GuiGraphicsExtractor / GuiGraphics (методы blitSprite)" "GuiGraphics(Extractor)?\.class$" "blitSprite"

          dump_javap "RenderPipelines (константы GUI)" "/RenderPipelines\.class$" "GUI|gui"
          dump_javap "ClipContext" "/ClipContext\.class$" ""

          echo "===== javap версия/доступность (для диагностики, если что-то из выше пусто) ====="
          javap -version 2>&1 || echo "javap недоступен в PATH"

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: echovision-jar
          path: build/libs/*.jar
