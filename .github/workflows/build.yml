name: Build EchoVision

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # ВРЕМЕННЫЙ диагностический шаг УДАЛЁН: реальные сигнатуры Camera,
      # GameRenderer, Minecraft, GuiGraphicsExtractor, ClipContext и всего
      # пакета net.minecraft.gizmos уже подтверждены через javap и учтены
      # в коде (см. EchoVisionGizmoRenderer). Если появятся новые ошибки
      # компиляции на других классах, аналогичный шаг с javap можно будет
      # добавить обратно по тому же принципу.

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: echovision-jar
          path: build/libs/*.jar
