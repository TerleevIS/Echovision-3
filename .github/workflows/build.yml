name: Build EchoVision

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # ВРЕМЕННЫЙ диагностический шаг. WorldRenderEvents в этой версии
      # Fabric API не существует (см. предыдущий CI-лог) — рендер мира
      # переписан на новую систему (SubmitNodeCollector/GpuBufferSlice).
      # Зато в Minecraft.java/LevelRenderer.java нашёлся встроенный пакет
      # net.minecraft.gizmos.* (Gizmos, SimpleGizmoCollector,
      # collectPerTickGizmos/addMainThreadGizmos) — похоже на официальный
      # API для рисования отладочной геометрии (линий/боксов) прямо в
      # 3D-мире. Смотрим его точные сигнатуры через javap, прежде чем
      # переписывать рендер эха под него. Удалить после того, как 3D-рендер
      # соберётся.
      - name: DEBUG - dump gizmos API signatures
        run: |
          echo "DEBUG-SCRIPT-VERSION: v6-gizmos"

          MC_JAR=$(find "$HOME/.gradle/caches/fabric-loom/minecraftMaven" -iname "minecraft-merged-deobf-*.jar" ! -iname "*.backup" 2>/dev/null | head -n1)
          echo "Minecraft jar: $MC_JAR"
          if [ -z "$MC_JAR" ]; then
            gradle compileJava --stacktrace || true
            MC_JAR=$(find "$HOME/.gradle/caches/fabric-loom/minecraftMaven" -iname "minecraft-merged-deobf-*.jar" ! -iname "*.backup" 2>/dev/null | head -n1)
          fi

          echo "===== Все классы в пакете net.minecraft.gizmos ====="
          unzip -l "$MC_JAR" | grep -oE "net/minecraft/gizmos/[A-Za-z0-9_$]+\.class" | sort -u

          for cls in \
            "net.minecraft.gizmos.Gizmos" \
            "net.minecraft.gizmos.Gizmos\$TemporaryCollection" \
            "net.minecraft.gizmos.SimpleGizmoCollector" \
            "net.minecraft.gizmos.SimpleGizmoCollector\$GizmoInstance" \
            "net.minecraft.gizmos.GizmoCollector"; do
            echo "===== javap -p $cls ====="
            javap -p -classpath "$MC_JAR" "$cls" 2>&1 || true
          done

          echo "===== На всякий случай: все GizmoInstance-подобные классы во всём джарнике ====="
          unzip -l "$MC_JAR" | grep -iE "gizmo" | awk '{print $4}' | sort -u

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: echovision-jar
          path: build/libs/*.jar
