name: Build EchoVision

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # ВРЕМЕННЫЙ диагностический шаг. Gizmos.cuboid(BlockPos, GizmoStyle) —
      # то, что нужно для контуров блоков в 3D. Осталось узнать точный
      # формат GizmoStyle (цвет/толщина линии) и базовый интерфейс Gizmo/
      # GizmoProperties, прежде чем писать финальный рендер. Удалить после
      # того, как 3D-рендер соберётся.
      - name: DEBUG - dump GizmoStyle API signatures
        run: |
          echo "DEBUG-SCRIPT-VERSION: v7-gizmostyle"

          MC_JAR=$(find "$HOME/.gradle/caches/fabric-loom/minecraftMaven" -iname "minecraft-merged-deobf-*.jar" ! -iname "*.backup" 2>/dev/null | head -n1)
          echo "Minecraft jar: $MC_JAR"
          if [ -z "$MC_JAR" ]; then
            gradle compileJava --stacktrace || true
            MC_JAR=$(find "$HOME/.gradle/caches/fabric-loom/minecraftMaven" -iname "minecraft-merged-deobf-*.jar" ! -iname "*.backup" 2>/dev/null | head -n1)
          fi

          for cls in \
            "net.minecraft.gizmos.GizmoStyle" \
            "net.minecraft.gizmos.Gizmo" \
            "net.minecraft.gizmos.GizmoProperties" \
            "net.minecraft.gizmos.CuboidGizmo" \
            "net.minecraft.gizmos.LineGizmo" \
            "net.minecraft.gizmos.GizmoPrimitives"; do
            echo "===== javap -p $cls ====="
            javap -p -classpath "$MC_JAR" "$cls" 2>&1 || true
          done

          echo "===== Ищу, где движок сам вызывает collectPerTickGizmos/withCollector (для понимания, когда безопасно звать Gizmos.* из мода) ====="
          MC_JAR2="$MC_JAR"
          for cls in "net.minecraft.client.Minecraft"; do
            javap -p -classpath "$MC_JAR2" "$cls" 2>&1 | grep -i "gizmo" || true
          done

          echo "===== Проверяю наличие ClientTickEvents (Fabric API) для планирования вызова гизмо на тик ====="
          for jar in $(find "$HOME/.gradle/caches/modules-2" -iname "*.jar" 2>/dev/null); do
            if unzip -l "$jar" 2>/dev/null | grep -q "ClientTickEvents.class"; then
              echo "Found in: $jar"
              javap -p -classpath "$jar" net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents 2>&1 || true
              break
            fi
          done

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: echovision-jar
          path: build/libs/*.jar
